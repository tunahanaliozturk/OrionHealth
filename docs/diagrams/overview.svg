<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>


  <rect width="1200" height="520" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionHealth - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">The core tags and registers checks over Microsoft.Extensions.Diagnostics.HealthChecks; OrionHealth.AspNetCore maps the two probe endpoints.</text>

  <!-- kubelet -->
  <rect class="ext" x="40" y="110" width="250" height="80" rx="14"/>
  <text class="label" x="165" y="143" text-anchor="middle">Kubernetes kubelet</text>
  <text class="code" x="165" y="167" text-anchor="middle">GET /healthz, GET /readyz</text>

  <path class="flow" d="M290,150 L368,150"/>
  <text class="edge" x="329" y="140" text-anchor="middle">probe</text>

  <!-- aspnetcore -->
  <rect class="step" x="370" y="110" width="330" height="80" rx="14"/>
  <text class="label" x="535" y="140" text-anchor="middle">OrionHealth.AspNetCore</text>
  <text class="code" x="535" y="164" text-anchor="middle">MapOrionHealth()</text>
  <text class="small" x="535" y="182" text-anchor="middle">/healthz: IsLiveness, /readyz: IsReadiness</text>

  <path class="flow" d="M700,150 L778,150"/>
  <text class="edge" x="739" y="140" text-anchor="middle">maps</text>

  <!-- health checks -->
  <rect class="ext" x="780" y="110" width="380" height="80" rx="14"/>
  <text class="label" x="970" y="140" text-anchor="middle">ASP.NET Core health checks</text>
  <text class="code" x="970" y="164" text-anchor="middle">MapHealthChecks, HealthCheckService</text>
  <text class="small" x="970" y="182" text-anchor="middle">runs the checks the predicate selects</text>

  <path class="flow" d="M535,190 L535,238"/>
  <text class="edge" x="545" y="219">references</text>

  <!-- app -->
  <rect class="step" x="40" y="260" width="250" height="110" rx="14"/>
  <text class="label" x="165" y="292" text-anchor="middle">Your app</text>
  <text class="code" x="165" y="318" text-anchor="middle">services.AddOrionHealth()</text>
  <text class="code" x="165" y="342" text-anchor="middle">app.MapOrionHealth()</text>

  <path class="flow" d="M290,282 L330,282 L330,172 L368,172"/>
  <path class="flow" d="M290,345 L368,345"/>
  <text class="edge" x="329" y="335" text-anchor="middle">registers</text>

  <!-- core -->
  <rect class="step" x="370" y="240" width="330" height="250" rx="14"/>
  <text class="label" x="535" y="270" text-anchor="middle">OrionHealth (core)</text>
  <text class="code" x="390" y="302">AddOrionHealth(configure?)</text>
  <text class="code" x="390" y="328">AddLivenessCheck / AddReadinessCheck</text>
  <text class="code" x="390" y="354">OrionHealthTags: "live" / "ready"</text>
  <text class="code" x="390" y="380">HealthReportWriter.Serialize</text>
  <text class="code" x="390" y="406">HealthDiagnostics</text>
  <text class="code" x="390" y="432">OrionHealthOptions</text>
  <text class="small" x="390" y="466">framework-free, AOT- and trim-clean</text>

  <path class="flow" d="M700,262 L850,262 L850,192"/>
  <text class="edge" x="860" y="232">AddHealthChecks()</text>

  <!-- abstractions -->
  <rect class="ext" x="780" y="300" width="380" height="80" rx="14"/>
  <text class="label" x="970" y="332" text-anchor="middle">Orion.Abstractions</text>
  <text class="small" x="970" y="356" text-anchor="middle">OrionInstrumentation, OrionTelemetry names</text>

  <path class="flow" d="M700,340 L778,340"/>
  <text class="edge" x="739" y="330" text-anchor="middle">builds on</text>

  <!-- otel -->
  <rect class="ext" x="780" y="410" width="380" height="80" rx="14"/>
  <text class="label" x="970" y="438" text-anchor="middle">OpenTelemetry / MeterListener</text>
  <text class="code" x="970" y="460" text-anchor="middle">meter Moongazing.OrionHealth</text>
  <text class="small" x="970" y="479" text-anchor="middle">orion.health.check.duration (ms)</text>

  <path class="flow" d="M700,450 L778,450"/>
  <text class="edge" x="739" y="440" text-anchor="middle">emits</text>

  <!-- note -->
  <rect class="note" x="40" y="400" width="250" height="90" rx="10"/>
  <text class="small" x="56" y="428">OrionHealth.AspNetCore needs the</text>
  <text class="small" x="56" y="448">ASP.NET Core shared framework;</text>
  <text class="small" x="56" y="468">the core does not.</text>
</svg>
